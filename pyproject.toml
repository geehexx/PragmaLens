[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pragmalens"
version = "0.1.0"
description = "PragmaLens v0.1: natural-language evidence and discourse audit engine bootstrap"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Andrew Crozier" }]
dependencies = [
  "typer>=0.12",
  "click>=8.1",
  "pydantic>=2.7",
  "spacy>=3.8",
  "langextract>=1.5.0",
  "gliner2>=1.3.1",
  "transformers>=5.0.0",
  "sentence-transformers>=5.0.0",
]

[project.optional-dependencies]
models = [
  "torch>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "lefthook>=1.8.0",
]

[project.scripts]
pragmalens = "pragmalens.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live_smoke: optional live integration tests; excluded from default CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/pragmalens"]

[tool.hatch.build.targets.sdist]
include = [
  "src/pragmalens",
  "tests",
  "README.md",
  "pyproject.toml",
]
