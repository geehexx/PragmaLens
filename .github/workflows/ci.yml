name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/pragmalens tests

      - name: Pytest (offline default)
        run: uv run pytest -q -m "not live_smoke"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
