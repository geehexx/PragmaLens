commit-msg:
  commands:
    commitizen:
      run: uv run cz check --allow-abort --commit-msg-file {1}

pre-commit:
  parallel: true
  commands:
    repo-layout:
      run: uv run python scripts/check_product_repo_layout.py
    ruff:
      run: uv run ruff check .
    format:
      run: uv run ruff format --check .

pre-push:
  parallel: true
  commands:
    mypy:
      run: uv run mypy src/pragmalens tests
    compileall:
      run: uv run python -m compileall -q src tests
    pytest:
      run: uv run pytest -q -m "not live_smoke" --testmon
    schema:
      run: uv run python scripts/check_schema_parity.py
    stage:
      run: uv run python scripts/check_stage_graph.py
